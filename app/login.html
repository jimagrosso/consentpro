<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ConsentPro · Acceso médico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
    :root{--gold:#C8A24A;--navy:#0f172a;--border:rgba(255,255,255,0.08)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    .card{animation:fadeUp .5s ease forwards;background:rgba(21,31,53,.8);border:1px solid var(--border);border-radius:20px;backdrop-filter:blur(20px);padding:40px;width:100%;max-width:420px}
    .input-field{width:100%;padding:12px 16px;background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#e2e8f0;font-size:.9rem;font-family:'DM Sans',sans-serif;transition:border-color .2s,box-shadow .2s;outline:none}
    .input-field:focus{border-color:rgba(200,162,74,.5);box-shadow:0 0 0 3px rgba(200,162,74,.1)}
    .input-field::placeholder{color:rgba(226,232,240,.3)}
    .btn-gold{width:100%;padding:13px;background:linear-gradient(135deg,#C8A24A,#A8832A);color:#0f172a;font-weight:700;font-size:.9rem;border-radius:10px;border:none;cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(200,162,74,.3);font-family:'DM Sans',sans-serif}
    .btn-gold:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(200,162,74,.4)}
    .btn-gold:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .tab-btn{flex:1;padding:10px;border-radius:8px;border:none;background:transparent;font-size:.85rem;font-weight:600;color:rgba(226,232,240,.5);cursor:pointer;transition:all .25s;font-family:'DM Sans',sans-serif}
    .tab-btn.active{background:rgba(200,162,74,.12);color:var(--gold);border:1px solid rgba(200,162,74,.25)}
    .error-msg{padding:10px 14px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:8px;font-size:.8rem;color:#fca5a5;display:none}
    .success-msg{padding:10px 14px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);border-radius:8px;font-size:.8rem;color:#86efac;display:none}
    label{font-size:.78rem;font-weight:600;color:rgba(226,232,240,.6);display:block;margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase}
    .divider{display:flex;align-items:center;gap:12px;margin:18px 0}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .divider span{font-size:.72rem;color:rgba(226,232,240,.3)}
    a.link{color:var(--gold);text-decoration:none;font-size:.8rem;font-weight:500}
    a.link:hover{text-decoration:underline}
  </style>
</head>
<body>
  <!-- Glow bg -->
  <div style="position:fixed;inset:0;pointer-events:none;overflow:hidden">
    <div style="position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(200,162,74,.07),transparent 65%)"></div>
  </div>

  <div class="card" style="position:relative;z-index:1">
    <!-- Logo -->
    <div class="flex items-center justify-center gap-2.5 mb-7">
      <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#C8A24A,#A8832A);display:flex;align-items:center;justify-content:center">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1L2 4v4c0 3.5 2.5 6.5 6 7.5C11.5 14.5 14 11.5 14 8V4L8 1z" fill="#0f172a"/><path d="M5.5 8.5l1.8 1.8 3.2-3.2" stroke="#C8A24A" stroke-width="1.3" stroke-linecap="round"/></svg>
      </div>
      <span style="font-family:'Playfair Display',serif;font-weight:700;font-size:1.3rem;color:#fff">ConsentPro</span>
    </div>

    <!-- Tabs -->
    <div class="flex gap-1 p-1 rounded-xl mb-6" style="background:rgba(15,23,42,.6);border:1px solid var(--border)">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Iniciar sesión</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Registrarse</button>
    </div>

    <!-- Mensajes -->
    <div id="error-msg" class="error-msg mb-4"></div>
    <div id="success-msg" class="success-msg mb-4"></div>

    <!-- LOGIN FORM -->
    <form id="form-login" onsubmit="handleLogin(event)">
      <div style="margin-bottom:16px">
        <label>Email</label>
        <input type="email" id="login-email" class="input-field" placeholder="doctor@gmail.com" required/>
      </div>
      <div style="margin-bottom:20px">
        <div class="flex justify-between items-center" style="margin-bottom:6px">
          <label style="margin-bottom:0">Contraseña</label>
          <a href="#" class="link" onclick="handleForgot(event)">¿Olvidaste tu contraseña?</a>
        </div>
        <input type="password" id="login-password" class="input-field" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn-gold" id="btn-login">Entrar a mi panel</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="form-register" style="display:none" onsubmit="handleRegister(event)">
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div>
          <label>Nombre</label>
          <input type="text" id="reg-nombre" class="input-field" placeholder="Carlos" required/>
        </div>
        <div>
          <label>Apellido</label>
          <input type="text" id="reg-apellido" class="input-field" placeholder="García" required/>
        </div>
      </div>
      <div style="margin-bottom:14px">
        <label>Email</label>
        <input type="email" id="reg-email" class="input-field" placeholder="doctor@gmail.com" required/>
      </div>
      <div style="margin-bottom:14px">
        <label>Especialidad</label>
        <select id="reg-especialidad" class="input-field" style="cursor:pointer">
          <option value="">Selecciona tu especialidad</option>
          <option>Ginecología y Obstetricia</option>
          <option>Cirugía General</option>
          <option>Medicina Estética</option>
          <option>Odontología</option>
          <option>Dermatología</option>
          <option>Traumatología</option>
          <option>Cardiología</option>
          <option>Pediatría</option>
          <option>Oftalmología</option>
          <option>Urología</option>
          <option>Psiquiatría</option>
          <option>Anestesiología</option>
          <option>Medicina General</option>
          <option>Otra</option>
        </select>
      </div>
      <div style="margin-bottom:20px">
        <label>Contraseña</label>
        <input type="password" id="reg-password" class="input-field" placeholder="Mínimo 8 caracteres" minlength="8" required/>
      </div>
      <button type="submit" class="btn-gold" id="btn-register">Crear mi cuenta gratis</button>
      <p style="font-size:.72rem;color:rgba(226,232,240,.3);text-align:center;margin-top:12px">Al registrarte aceptas los términos de uso.</p>
    </form>

    <div class="divider"><span>¿Necesitas ayuda?</span></div>
    <div style="text-align:center">
      <a href="https://wa.me/584145173115" target="_blank" class="link" style="display:inline-flex;align-items:center;gap:6px;font-size:.8rem">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 .75C3.1.75.75 3.1.75 6c0 .97.25 1.88.7 2.67L.75 11.25l2.64-.7A5.23 5.23 0 006 11.25c2.9 0 5.25-2.35 5.25-5.25S8.9.75 6 .75z" fill="#C8A24A"/></svg>
        Contactar al Abg. Rojas
      </a>
    </div>
  </div>

  <script>
    // ── Supabase init ──
    const SUPABASE_URL = 'https://xinubscrhnjcixokidyi.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpbnVic2NyaG5qY2l4b2tpZHlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2MjcwMTMsImV4cCI6MjA4NzIwMzAxM30.ktHJ0Qb0xr6O5SanmcpMSrzgwDCSF0ybJIDBY_8kFuA';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Redirigir si ya tiene sesión
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    function switchTab(tab) {
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      clearMsgs();
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg; el.style.display = 'block';
      document.getElementById('success-msg').style.display = 'none';
    }
    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.textContent = msg; el.style.display = 'block';
      document.getElementById('error-msg').style.display = 'none';
    }
    function clearMsgs() {
      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('success-msg').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      btn.disabled = true; btn.textContent = 'Entrando...';
      clearMsgs();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        const msgs = {
          'Invalid login credentials': 'Email o contraseña incorrectos.',
          'Email not confirmed': 'Por favor confirma tu email antes de entrar.',
        };
        showError(msgs[error.message] || error.message);
        btn.disabled = false; btn.textContent = 'Entrar a mi panel';
      } else {
        showSuccess('¡Bienvenido! Redirigiendo...');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-register');
      btn.disabled = true; btn.textContent = 'Creando cuenta...';
      clearMsgs();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const nombre = document.getElementById('reg-nombre').value.trim();
      const apellido = document.getElementById('reg-apellido').value.trim();
      const especialidad = document.getElementById('reg-especialidad').value;

      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { nombre, apellido, especialidad } }
      });

      if (error) {
        showError(error.message === 'User already registered'
          ? 'Ya existe una cuenta con ese email. Inicia sesión.'
          : error.message);
        btn.disabled = false; btn.textContent = 'Crear mi cuenta gratis';
      } else {
        // Actualizar perfil con datos extras
        if (data.user) {
          await sb.from('perfiles').upsert({
            id: data.user.id, email, nombre, apellido, especialidad
          });
        }
        showSuccess('✅ Cuenta creada. Revisa tu email para confirmar y luego inicia sesión.');
        btn.disabled = false; btn.textContent = 'Crear mi cuenta gratis';
        setTimeout(() => switchTab('login'), 2500);
      }
    }

    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      if (!email) { showError('Escribe tu email primero.'); return; }
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/app/reset.html'
      });
      if (error) showError(error.message);
      else showSuccess('Te enviamos un link para restablecer tu contraseña.');
    }
  </script>
</body>
</html>

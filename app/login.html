<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ConsentPro · Acceder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
    :root{--gold:#C8A24A;--navy:#0b1120;--border:rgba(255,255,255,0.08)}
    .bg-glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(200,162,74,.07),transparent 65%);pointer-events:none}
    .card{background:rgba(21,31,53,.8);border:1px solid rgba(200,162,74,.2);border-radius:24px;backdrop-filter:blur(20px);width:100%;max-width:440px;padding:40px;box-shadow:0 40px 100px rgba(0,0,0,.4)}
    .tab-btn{flex:1;padding:10px;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .25s;border:none;background:transparent;color:rgba(226,232,240,.4)}
    .tab-btn.active{background:rgba(200,162,74,.12);color:var(--gold);border:1px solid rgba(200,162,74,.3)}
    .input-field{width:100%;padding:12px 16px;background:rgba(11,17,32,.7);border:1px solid var(--border);border-radius:12px;color:#e2e8f0;font-size:.875rem;font-family:'DM Sans',sans-serif;transition:border-color .2s;outline:none}
    .input-field:focus{border-color:rgba(200,162,74,.5)}
    .input-field::placeholder{color:rgba(226,232,240,.25)}
    .btn-gold{width:100%;padding:14px;background:linear-gradient(135deg,#C8A24A,#A8832A);color:#0b1120;font-weight:700;font-size:.9rem;border-radius:12px;border:none;cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(200,162,74,.3);font-family:'DM Sans',sans-serif}
    .btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(200,162,74,.45)}
    .btn-gold:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .alert{padding:12px 16px;border-radius:12px;font-size:.8rem;line-height:1.5;margin-bottom:16px}
    .alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
    .alert-success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac}
    select.input-field option{background:#1e293b;color:#e2e8f0}
    @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    .card{animation:fadeIn .5s ease}
  </style>
</head>
<body>
<div class="bg-glow"></div>

<div class="card">
  <!-- Logo -->
  <div class="flex items-center gap-3 mb-8 justify-center">
    <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#C8A24A,#A8832A)">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 1.5L2 5v5c0 4.5 3 8 7 9 4-1 7-4.5 7-9V5L9 1.5z" fill="#0b1120"/><path d="M6 9l2.5 2.5L12 7" stroke="#C8A24A" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
    <span style="font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:#fff">ConsentPro</span>
  </div>

  <!-- Tabs -->
  <div class="flex gap-2 mb-7 p-1 rounded-xl" style="background:rgba(11,17,32,.5);border:1px solid var(--border)">
    <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Iniciar sesión</button>
    <button class="tab-btn" id="tab-registro" onclick="switchTab('registro')">Crear cuenta</button>
  </div>

  <!-- Alert -->
  <div id="alert" class="alert" style="display:none"></div>

  <!-- LOGIN FORM -->
  <form id="form-login" onsubmit="handleLogin(event)">
    <div class="space-y-4">
      <div>
        <label style="font-size:.75rem;font-weight:600;color:rgba(226,232,240,.5);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:8px">Email</label>
        <input type="email" id="login-email" class="input-field" placeholder="dr.ejemplo@clinica.com" required/>
      </div>
      <div>
        <label style="font-size:.75rem;font-weight:600;color:rgba(226,232,240,.5);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:8px">Contraseña</label>
        <input type="password" id="login-pass" class="input-field" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn-gold mt-2" id="btn-login">
        Entrar al panel
      </button>
    </div>
  </form>

  <!-- REGISTRO FORM -->
  <form id="form-registro" style="display:none" onsubmit="handleRegistro(event)">
    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label style="font-size:.75rem;font-weight:600;color:rgba(226,232,240,.5);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:8px">Nombre</label>
          <input type="text" id="reg-nombre" class="input-field" placeholder="Carlos" required/>
        </div>
        <div>
          <label style="font-size:.75rem;font-weight:600;color:rgba(226,232,240,.5);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:8px">Apellido</label>
          <input type="text" id="reg-apellido" class="input-field" placeholder="Rodríguez" required/>
        </div>
      </div>
      <div>
        <label style="font-size:.75rem;font-weight:600;color:rgba(226,232,240,.5);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:8px">Email profesional</label>
        <input type="email" id="reg-email" class="input-field" placeholder="dr.rodriguez@clinica.com" required/>
      </div>
      <div>
        <label style="font-size:.75rem;font-weight:600;color:rgba(226,232,240,.5);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:8px">Especialidad</label>
        <select id="reg-especialidad" class="input-field" required>
          <option value="">Selecciona tu especialidad</option>
          <option>Medicina General</option>
          <option>Ginecología y Obstetricia</option>
          <option>Cirugía General</option>
          <option>Pediatría</option>
          <option>Cardiología</option>
          <option>Ortopedia y Traumatología</option>
          <option>Dermatología</option>
          <option>Oftalmología</option>
          <option>Odontología</option>
          <option>Medicina Estética</option>
          <option>Anestesiología</option>
          <option>Neurología</option>
          <option>Oncología</option>
          <option>Otra especialidad</option>
        </select>
      </div>
      <div>
        <label style="font-size:.75rem;font-weight:600;color:rgba(226,232,240,.5);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:8px">Contraseña</label>
        <input type="password" id="reg-pass" class="input-field" placeholder="Mínimo 8 caracteres" minlength="8" required/>
      </div>
      <div>
        <label style="font-size:.75rem;font-weight:600;color:rgba(226,232,240,.5);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:8px">País</label>
        <select id="reg-pais" class="input-field">
          <option value="Venezuela">Venezuela</option>
          <option value="Colombia">Colombia</option>
          <option value="México">México</option>
          <option value="Argentina">Argentina</option>
          <option value="España">España</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <button type="submit" class="btn-gold mt-2" id="btn-registro">
        Crear mi cuenta
      </button>
    </div>
  </form>

  <p class="mt-6 text-center" style="font-size:.72rem;color:rgba(226,232,240,.25)">
    Respaldado por el Abg. José Manuel Rojas · Datos cifrados AES-256
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://xinubscrhnjcixokidyi.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpbnVic2NyaG5qY2l4b2tpZHlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2MjcwMTMsImV4cCI6MjA4NzIwMzAxM30.ktHJ0Qb0xr6O5SanmcpMSrzgwDCSF0ybJIDBY_8kFuA';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // Redirigir si ya está logueado
  sb.auth.getSession().then(({data:{session}}) => {
    if(session) window.location.href = 'dashboard.html';
  });

  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-registro').classList.toggle('active', !isLogin);
    document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
    document.getElementById('form-registro').style.display = isLogin ? 'none' : 'block';
    hideAlert();
  }

  function showAlert(msg, type='error') {
    const el = document.getElementById('alert');
    el.className = `alert alert-${type}`;
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideAlert() { document.getElementById('alert').style.display = 'none'; }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Entrando...';
    hideAlert();
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('login-email').value.trim(),
      password: document.getElementById('login-pass').value
    });
    if(error) {
      showAlert('Email o contraseña incorrectos. Verifica tus datos.');
      btn.disabled = false; btn.textContent = 'Entrar al panel';
    } else {
      btn.textContent = '✓ Redirigiendo...';
      window.location.href = 'dashboard.html';
    }
  }

  async function handleRegistro(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-registro');
    btn.disabled = true; btn.textContent = 'Creando cuenta...';
    hideAlert();
    const nombre = document.getElementById('reg-nombre').value.trim();
    const apellido = document.getElementById('reg-apellido').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-pass').value;
    const especialidad = document.getElementById('reg-especialidad').value;
    const pais = document.getElementById('reg-pais').value;

    const { data, error } = await sb.auth.signUp({
      email, password: pass,
      options: { data: { nombre, apellido, especialidad, pais } }
    });

    if(error) {
      showAlert(error.message.includes('already') ? 'Ya existe una cuenta con ese email.' : 'Error al crear cuenta: ' + error.message);
      btn.disabled = false; btn.textContent = 'Crear mi cuenta';
    } else {
      // Insert perfil
      if(data.user) {
        await sb.from('perfiles').upsert({
          id: data.user.id, email, nombre, apellido, especialidad, pais,
          plan: 'gratuito',
          consentimientos_disponibles: 3,
          consentimientos_usados: 0
        });
      }
      showAlert('¡Cuenta creada! Revisa tu email para confirmar y luego inicia sesión.', 'success');
      btn.disabled = false; btn.textContent = 'Crear mi cuenta';
      setTimeout(() => switchTab('login'), 3000);
    }
  }
</script>
</body>
</html>

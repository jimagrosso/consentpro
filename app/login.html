<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ConsentPro · Acceder</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px}
    :root{--gold:#C8A24A;--navy:#0b1120;--border:rgba(255,255,255,0.08)}
    .bg-glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(200,162,74,.07),transparent 65%);pointer-events:none}
    .card{background:rgba(21,31,53,.8);border:1px solid rgba(200,162,74,.2);border-radius:24px;backdrop-filter:blur(20px);width:100%;max-width:440px;padding:40px;box-shadow:0 40px 100px rgba(0,0,0,.4)}
    .tab-btn{flex:1;padding:10px;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .25s;border:none;background:transparent;color:rgba(226,232,240,.4)}
    .tab-btn.active{background:rgba(200,162,74,.12);color:var(--gold);border:1px solid rgba(200,162,74,.3)}
    .input-field{width:100%;padding:12px 16px;background:rgba(11,17,32,.7);border:1px solid var(--border);border-radius:12px;color:#e2e8f0;font-size:.875rem;font-family:'DM Sans',sans-serif;transition:border-color .2s;outline:none}
    .input-field:focus{border-color:rgba(200,162,74,.5)}
    .input-field::placeholder{color:rgba(226,232,240,.25)}
    .btn-gold{width:100%;padding:14px;background:linear-gradient(135deg,#C8A24A,#A8832A);color:#0b1120;font-weight:700;font-size:.9rem;border-radius:12px;border:none;cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(200,162,74,.3);font-family:'DM Sans',sans-serif}
    .btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(200,162,74,.45)}
    .btn-gold:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .btn-google{width:100%;padding:13px;background:#fff;color:#1f2937;font-weight:600;font-size:.875rem;border-radius:12px;border:none;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'DM Sans',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25)}
    .btn-google:hover{background:#f3f4f6;transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
    .btn-google:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .divider span{font-size:.72rem;color:rgba(226,232,240,.3);font-weight:500;letter-spacing:.04em;white-space:nowrap}
    .alert{padding:12px 16px;border-radius:12px;font-size:.8rem;line-height:1.5;margin-bottom:16px}
    .alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
    .alert-success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac}
    select.input-field option{background:#1e293b;color:#e2e8f0}
    @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    .card{animation:fadeIn .5s ease}
    .space-y-4>*+*{margin-top:16px}

    /* ── Loading overlay global ─────────────────────── */
    #cp-loading{position:fixed;inset:0;z-index:9999;background:rgba(11,17,32,.92);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;pointer-events:none;transition:opacity .25s ease}
    #cp-loading.show{opacity:1;pointer-events:all}
    #cp-loading .cp-spinner{width:44px;height:44px;border:3px solid rgba(200,162,74,.2);border-top-color:#C8A24A;border-radius:50%;animation:cpSpin .75s linear infinite}
    #cp-loading .cp-msg{font-size:.95rem;font-weight:600;color:#f1f5f9;text-align:center;letter-spacing:.01em}
    #cp-loading .cp-sub{font-size:.78rem;color:rgba(226,232,240,.4);text-align:center;margin-top:-12px}
    @keyframes cpSpin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <!-- Loading overlay global -->
  <div id="cp-loading">
    <div class="cp-spinner"></div>
    <p class="cp-msg" id="cp-loading-msg">Cargando...</p>
    <p class="cp-sub" id="cp-loading-sub">Un momento, por favor</p>
  </div>
<div class="bg-glow"></div>

<div class="card">
  <!-- Logo -->
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center">
    <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#C8A24A,#A8832A);display:flex;align-items:center;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 1.5L2 5v5c0 4.5 3 8 7 9 4-1 7-4.5 7-9V5L9 1.5z" fill="#0b1120"/><path d="M6 9l2.5 2.5L12 7" stroke="#C8A24A" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
    <span style="font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:#fff">ConsentPro</span>
  </div>

  <!-- Tabs -->
  <div style="display:flex;gap:8px;margin-bottom:28px;padding:4px;border-radius:14px;background:rgba(11,17,32,.5);border:1px solid var(--border)">
    <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Iniciar sesión</button>
    <button class="tab-btn" id="tab-registro" onclick="switchTab('registro')">Crear cuenta</button>
  </div>

  <!-- Alert -->
  <div id="alert" class="alert" style="display:none"></div>

  <!-- BOTÓN GOOGLE (visible en ambos tabs) -->
  <button class="btn-google" id="btn-google" onclick="loginGoogle()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.707A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.96L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
    Continuar con Google
  </button>

  <div class="divider"><span>o continúa con email</span></div>

  <!-- LOGIN FORM -->
  <form id="form-login" onsubmit="handleLogin(event)">
    <div class="space-y-4">
      <div>
        <label style="font-size:.72rem;font-weight:600;color:rgba(226,232,240,.45);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:7px">Email</label>
        <input type="email" id="login-email" class="input-field" placeholder="dr.ejemplo@clinica.com" required/>
      </div>
      <div>
        <label style="font-size:.72rem;font-weight:600;color:rgba(226,232,240,.45);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:7px">Contraseña</label>
        <input type="password" id="login-pass" class="input-field" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn-gold" id="btn-login">Entrar al panel</button>
    </div>
  </form>

  <!-- REGISTRO FORM -->
  <form id="form-registro" style="display:none" onsubmit="handleRegistro(event)">
    <div class="space-y-4">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label style="font-size:.72rem;font-weight:600;color:rgba(226,232,240,.45);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:7px">Nombre</label>
          <input type="text" id="reg-nombre" class="input-field" placeholder="Carlos" required/>
        </div>
        <div>
          <label style="font-size:.72rem;font-weight:600;color:rgba(226,232,240,.45);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:7px">Apellido</label>
          <input type="text" id="reg-apellido" class="input-field" placeholder="Rodríguez" required/>
        </div>
      </div>
      <div>
        <label style="font-size:.72rem;font-weight:600;color:rgba(226,232,240,.45);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:7px">Email profesional</label>
        <input type="email" id="reg-email" class="input-field" placeholder="dr.rodriguez@clinica.com" required/>
      </div>
      <div>
        <label style="font-size:.72rem;font-weight:600;color:rgba(226,232,240,.45);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:7px">Contraseña</label>
        <input type="password" id="reg-pass" class="input-field" placeholder="Mínimo 8 caracteres" minlength="8" required/>
      </div>
      <div>
        <label style="font-size:.72rem;font-weight:600;color:rgba(226,232,240,.45);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:7px">País</label>
        <select id="reg-pais" class="input-field">
          <option value="Venezuela">Venezuela</option>
          <option value="Colombia">Colombia</option>
          <option value="México">México</option>
          <option value="Argentina">Argentina</option>
          <option value="España">España</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <button type="submit" class="btn-gold" id="btn-registro">Crear mi cuenta</button>
    </div>
  </form>

  <p style="margin-top:20px;text-align:center;font-size:.7rem;color:rgba(226,232,240,.2)">
    Respaldado por el Abg. José Manuel Rojas · Datos cifrados AES-256
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="plantillas-catalogo.js"></script>
<script>

  // ── Loading overlay ──────────────────────────────────────────
  function cpShow(msg, sub) {
    document.getElementById('cp-loading-msg').textContent = msg || 'Cargando...';
    document.getElementById('cp-loading-sub').textContent = sub || 'Un momento, por favor';
    document.getElementById('cp-loading').classList.add('show');
  }
  function cpHide() { document.getElementById('cp-loading').classList.remove('show'); }
  function cpMsg(msg, sub) {
    document.getElementById('cp-loading-msg').textContent = msg;
    if (sub !== undefined) document.getElementById('cp-loading-sub').textContent = sub;
  }
  const SUPABASE_URL = 'https://xinubscrhnjcixokidyi.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpbnVic2NyaG5qY2l4b2tpZHlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2MjcwMTMsImV4cCI6MjA4NzIwMzAxM30.ktHJ0Qb0xr6O5SanmcpMSrzgwDCSF0ybJIDBY_8kFuA';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // Tab desde URL
  if (window.location.hash === '#registro') {
    document.addEventListener('DOMContentLoaded', () => switchTab('registro'));
  }

  // Redirigir si ya está logueado — guard para evitar doble ejecución
  let _redirecting = false;

  sb.auth.getSession().then(({data:{session}}) => {
    if (session && !_redirecting) {
      _redirecting = true;
      // Sesión existente → redirigir directo sin loading en login
      checkAndRedirect(session.user, false);
    }
  });

  // Listener para OAuth callback (Google) — solo para OAuth redirect
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session && !_redirecting) {
      _redirecting = true;
      cpShow('Iniciando sesión...', 'Verificando tu perfil');
      await checkAndRedirect(session.user, true);
    }
  });

  // Verificar si el usuario tiene especialidad → redirigir
  async function checkAndRedirect(user, showLoading = true) {
    // Timeout de seguridad: si algo cuelga, redirige al dashboard en 5s
    const safetyTimer = setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 5000);

    if (showLoading) {
      cpMsg('Verificando tu perfil...', 'Cargando tu información');
    }

    const { data: perfil } = await sb.from('perfiles')
      .select('especialidad')
      .eq('id', user.id)
      .single();

    if (!perfil || !perfil.especialidad) {
      clearTimeout(safetyTimer);
      cpMsg('Redirigiendo...', 'Configurando tu cuenta');
      window.location.href = 'especialidad.html';
    } else {
      // Si tiene especialidad pero aún no tiene plantillas → seed silencioso (sin bloquear)
      if (typeof seedTemplatesForUser === 'function') {
        const { count } = await sb.from('plantillas')
          .select('id', { count: 'exact', head: true })
          .eq('medico_id', user.id);
        if (!count || count === 0) {
          cpMsg('Preparando tus plantillas...', 'Solo un momento');
          await seedTemplatesForUser(user.id, perfil.especialidad);
        }
      }
      clearTimeout(safetyTimer);
      // Verificar si venía a comprar un plan
      const pendingPlan = localStorage.getItem('cp_pending_plan');
      if (pendingPlan) {
        localStorage.removeItem('cp_pending_plan');
        const STRIPE_LINKS = {
          esencial: 'https://buy.stripe.com/aFa8wQgfZ56Rgu85Wy5c40o',
          pro:      'https://buy.stripe.com/14A28se7R7eZcdS4Su5c40p',
          clinica:  'https://buy.stripe.com/dRmaEY7JtarbdhW70C5c40q'
        };
        const stripeUrl = STRIPE_LINKS[pendingPlan];
        if (stripeUrl) {
          const params = new URLSearchParams({
            client_reference_id: user.id,
            prefilled_email:     user.email
          });
          cpMsg('Redirigiendo a pago...', 'Abriendo Stripe');
          setTimeout(() => {
            window.location.href = 'dashboard.html'; // llevar al dashboard también
            window.open(stripeUrl + '?' + params.toString(), '_blank');
          }, 800);
          return;
        }
      }
      cpMsg('Entrando a tu panel...', '');
      window.location.href = 'dashboard.html';
    }
  }

  // Seed de plantillas para usuario (llamado desde login o especialidad.html)
  async function seedTemplatesForUser(userId, especialidad) {
    if (typeof getTemplatesForSpecialty !== 'function') return;
    const templates = getTemplatesForSpecialty(especialidad);
    if (!templates || templates.length === 0) return;
    // Verificar cuáles ya existen — una sola query en vez de N queries
    const { data: existentes } = await sb.from('plantillas')
      .select('id, catalog_id, descripcion')
      .eq('medico_id', userId)
      .in('catalog_id', templates.map(t => t.catalog_id));

    const existenteMap = {};
    (existentes || []).forEach(e => { existenteMap[e.catalog_id] = e; });

    // Insertar solo las que no existen — en paralelo
    const porInsertar = templates.filter(t => !existenteMap[t.catalog_id]);
    if (porInsertar.length > 0) {
      await sb.from('plantillas').insert(porInsertar.map(tpl => ({
        medico_id: userId, catalog_id: tpl.catalog_id,
        titulo: tpl.titulo, tipo_procedimiento: tpl.tipo_procedimiento,
        nombre_procedimiento: tpl.nombre_procedimiento,
        descripcion: tpl.descripcion, specialty_tags: tpl.specialty_tags,
        activa: true, es_catalogo: true,
        version: tpl.version || 1, locale: tpl.locale || 'es-LATAM'
      })));
    }

    // Actualizar descripciones vacías — en paralelo
    const porActualizar = templates.filter(t =>
      existenteMap[t.catalog_id] && !existenteMap[t.catalog_id].descripcion
    );
    await Promise.all(porActualizar.map(tpl =>
      sb.from('plantillas').update({
        descripcion: tpl.descripcion,
        nombre_procedimiento: tpl.nombre_procedimiento,
        tipo_procedimiento: tpl.tipo_procedimiento
      }).eq('id', existenteMap[tpl.catalog_id].id)
    ));
  }

  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-registro').classList.toggle('active', !isLogin);
    document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
    document.getElementById('form-registro').style.display = isLogin ? 'none' : 'block';
    hideAlert();
  }

  function showAlert(msg, type='error') {
    const el = document.getElementById('alert');
    el.className = `alert alert-${type}`;
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideAlert() { document.getElementById('alert').style.display = 'none'; }

  async function loginGoogle() {
    document.getElementById('btn-google').disabled = true; cpShow('Conectando con Google...','Te redirigiremos en un momento');
    document.getElementById('btn-google').textContent = 'Conectando...';
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + window.location.pathname
      }
    });
    if (error) {
      cpHide();
      showAlert('Error al conectar con Google. Intenta de nuevo.');
      document.getElementById('btn-google').disabled = false;
      document.getElementById('btn-google').innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.707A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.96L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg> Continuar con Google`;
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Entrando...'; cpShow('Iniciando sesión...','Verificando tus credenciales');
    hideAlert();
    const { data, error } = await sb.auth.signInWithPassword({
      email: document.getElementById('login-email').value.trim(),
      password: document.getElementById('login-pass').value
    });
    if (error) {
      showAlert('Email o contraseña incorrectos. Verifica tus datos.');
      btn.disabled = false; btn.textContent = 'Entrar al panel'; cpHide();
    } else {
      btn.textContent = '✓ Verificando perfil...'; cpMsg('Verificando tu perfil...','Ya casi estamos');
      await checkAndRedirect(data.user);
    }
  }

  async function handleRegistro(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-registro');
    btn.disabled = true; btn.textContent = 'Creando cuenta...'; cpShow('Creando tu cuenta...','Solo un momento');
    hideAlert();
    const nombre = document.getElementById('reg-nombre').value.trim();
    const apellido = document.getElementById('reg-apellido').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-pass').value;
    const pais = document.getElementById('reg-pais').value;

    const { data, error } = await sb.auth.signUp({
      email, password: pass,
      options: { data: { nombre, apellido, pais } }
    });

    if (error) {
      cpHide();
      showAlert(error.message.includes('already') ? 'Ya existe una cuenta con ese email.' : 'Error: ' + error.message);
      btn.disabled = false; btn.textContent = 'Crear mi cuenta';
    } else {
      // Crear perfil SIN especialidad → irá a pantalla de selección
      if (data.user) {
        await sb.from('perfiles').upsert({
          id: data.user.id, email, nombre, apellido, pais,
          plan: 'gratuito',
          consentimientos_disponibles: 3,
          consentimientos_usados: 0
          // especialidad intencionalmeente vacía → redirigirá a especialidad.html
        });
      }
      cpHide();
      showAlert('¡Cuenta creada! Revisa tu email para confirmar, luego inicia sesión.', 'success');
      btn.disabled = false; btn.textContent = 'Crear mi cuenta';
      setTimeout(() => switchTab('login'), 3000);
    }
  }
</script>
</body>
</html>
